<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Performance &mdash; PropertyPistol ROI Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2726%27 fill=%27none%27 stroke=%27%23FB6A02%27 stroke-width=%276%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%278%27 fill=%27%23FB6A02%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <section class="filters" id="filters"></section>

      <div class="card">
        <div class="card-head">
          <h3 id="srcTitle">Source Wise Report</h3>
          <span class="hint">MIS Table (write-off excluded) + QL LEADS DATA &middot; full period Mar&ndash;Aug &amp; Aug MTD</span>
        </div>
        <div class="tbl-wrap"><table class="tbl" id="tblSource"></table></div>
      </div>
      <div class="note" id="srcNote"></div>

      <div class="chart-grid">
        <div class="chart-card"><h4>Source Spend Mix</h4><div class="sub" id="mixSub"></div><div class="chart-box"><canvas id="chMix"></canvas></div></div>
        <div class="chart-card"><h4>Source Leads</h4><div class="sub" id="leadSub"></div><div class="chart-box"><canvas id="chLeads"></canvas></div></div>
      </div>

      <div class="card">
        <div class="card-head"><h3 id="campTitle">Campaign Register</h3><span class="hint">Live Campaign sheet &middot; Aug MTD cost &amp; leads (till 5 Aug)</span></div>
        <div class="tbl-wrap"><table class="tbl" id="tblCamp"></table></div>
      </div>
      <div class="note" id="campNote"></div>
    </div>
  </div>
</div>
<script src="js/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/campaign.js"></script>
</body>
</html>
